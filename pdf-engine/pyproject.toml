[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "freedf"
version = "0.2.0"
description = "FreeDF — a small, explicit, open PDF engine"
requires-python = ">=3.11"

[project.scripts]
# The distribution is FreeDF, but the command and the import path stay
# `pdfengine`. Renaming either would break every documented import and every
# script that calls the CLI, which the contract policy forbids without a
# version bump. See docs/CONTRACT-CHANGELOG.md.
pdfengine = "pdfengine.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pdfengine = ["schemas/*/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests", "tests/support"]
markers = [
    "requires_preview: needs a real Poppler installation (pdftoppm)",
    "requires_ocr: needs a real Tesseract installation",
]
# No -q here on purpose. The documented command is `pytest -q`, and a -q in
# addopts would make that -qq, which suppresses the pass/fail summary line
# entirely — leaving the one number anyone actually wants invisible.
